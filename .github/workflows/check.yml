# Copy this file into your assignment 2 repo as .github/workflows/check.yml
# and push. From then on every push gets a tick or a cross on GitHub, and the
# Actions tab shows the same checklist `uv run check.py --assignment 2` prints
# on your machine.
#
# It is the same file as check.yml with one line changed — the assignment number.
# That line is why you do not have to edit any YAML yourself.
name: Assignment check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: sd5913/pfad/.github/workflows/check-assignment.yml@2026
    with:
      assignment: "2"
